<!doctype html><html><body>
<script type="module">
// Pulls every image out of the BGG.CON hall map PDF with where it sits on the page (PDF units,
// y down), so each exhibitor logo can be matched to the booth it's drawn in.
import * as pdfjs from '/node_modules/pdfjs-dist/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/node_modules/pdfjs-dist/build/pdf.worker.min.mjs';
window.extract = async (url) => {
  const pdf = await pdfjs.getDocument(url).promise;
  const page = await pdf.getPage(1);
  const vp = page.getViewport({ scale: 1 });
  // Render once so every image gets decoded into page.objs.
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  const ops = await page.getOperatorList();
  const O = pdfjs.OPS; let ctm = [1, 0, 0, 1, 0, 0]; const stack = []; const out = [];
  const mul = (a, b) => [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], args = ops.argsArray[i];
    if (fn === O.save) stack.push(ctm); else if (fn === O.restore) ctm = stack.pop() || ctm;
    else if (fn === O.transform) ctm = mul(ctm, args);
    else if (fn === O.paintImageXObject || fn === O.paintJpegXObject) {
      const id = args[0];
      let img; try { img = page.objs.get(id); } catch { try { img = page.commonObjs.get(id); } catch { continue; } }
      if (!img) continue;
      const corners = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y]) => [ctm[0]*x + ctm[2]*y + ctm[4], vp.height - (ctm[1]*x + ctm[3]*y + ctm[5])]);
      const xs = corners.map(p => p[0]), ys = corners.map(p => p[1]);
      const w = img.width, h = img.height;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
      if (img.bitmap) g.drawImage(img.bitmap, 0, 0);
      else if (img.data) {
        const d = g.createImageData(w, h);
        if (img.data.length === w * h * 4) d.data.set(img.data);
        else if (img.data.length === w * h * 3) { for (let p = 0, q = 0; p < w * h; p++) { d.data[q++] = img.data[p*3]; d.data[q++] = img.data[p*3+1]; d.data[q++] = img.data[p*3+2]; d.data[q++] = 255; } }
        else continue;
        g.putImageData(d, 0, 0);
      } else continue;
      out.push({ id, w, h, box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], png: cv.toDataURL('image/png') });
    }
  }
  return out;
};
window.ready = true;
</script></body></html>
