<!doctype html><html><body><script>
// Downscales a logo to fit 240x240 (enough for a booth tile at 3x screen density) as WebP.
window.shrink = async (src, rotate) => {
  const img = new Image(); img.src = src; await img.decode();
  let w = img.naturalWidth, h = img.naturalHeight; if (rotate) [w, h] = [h, w];
  const s = Math.min(1, 240 / Math.max(w, h)); const cw = Math.round(w * s), ch = Math.round(h * s);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d');
  if (rotate) { g.translate(cw, 0); g.rotate(Math.PI / 2); g.drawImage(img, 0, 0, ch, cw); } else g.drawImage(img, 0, 0, cw, ch);
  return c.toDataURL('image/webp', 0.86);
};
window.ready = true;
</script></body></html>
