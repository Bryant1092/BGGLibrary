  <!--
    viewport-fit=cover makes iPhone report its "safe area" sizes (the home
    indicator bar at the bottom, the notch/status bar at the top). Without it
    they're all 0, so the tab bar's env(safe-area-inset-bottom) padding did
    nothing and the home indicator overlapped the "My Lists" tab on an
    installed app. styles.css adds the matching top/bottom padding.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    Home Screen icon on iPhone. Without it iPhone made a plain letter tile ("B"); it doesn't use
    the manifest's icons for this. 180x180 with a solid white background, because iPhone shows
    transparent areas as black. Made from icons/icon-512x512.png (2026-11-17).
  -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!--
    manifest.webmanifest (JSON can't hold comments):
    - theme_color is white to match the page header, so the phone's status bar
      blends into the app. The two theme-color tags below do the same per
      light/dark mode (#191817 is --bl-surface in dark mode, see styles.css).
    - Icons are "any" only. "maskable any" told Android the logo is safe to crop
      to a circle, but it reaches the icon's edges, so the corners got cut off.
      As "any", Android shows the whole logo on a white background instead.
  -->
  <link rel="manifest" href="manifest.webmanifest">
  <!--
    Open connections to the game library API and the thumbnail server while the
    app is still loading, so the first search doesn't also wait for DNS + TLS
    setup (a few hundred ms, more on convention Wi-Fi). The API is fetched with
    CORS, hence crossorigin; thumbnails are plain images, so no crossorigin.
  -->
  <link rel="preconnect" href="https://tabletop.events" crossorigin>
  <link rel="preconnect" href="https://cf.geekdo-images.com">
  <meta name="theme-color" content="#ffffff">
  <!--
    Light/dark theme, applied here before the page first paints so there's no
    white flash when the app opens in dark mode.
    - The choice ("system", "light" or "dark") is set on the Account tab and
      saved on this device (localStorage key bgglibrary.theme).
    - data-theme on <html> is always the resolved "light" or "dark" (for
      "system", whatever the phone is set to), so styles.css only needs one
      set of dark colors.
    - data-bs-theme does the same for the Bootstrap-styled login and 404 pages.
    - theme-color sets the phone's status bar to the page background
      (#191817 is --bl-surface in dark mode, see styles.css).
    ThemeService calls window.blApplyTheme when the setting changes.
  -->
  <!--
    Always open at the top. On a reload (e.g. tapping Update) iPhone put the screen back
    where you'd scrolled to, before the app had drawn anything that tall: the Home Screen
    app showed a blank page until you touched it (reported 2026-11-17).
  -->
  <script>
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) { /* older browsers */ }
  </script>
  <script>
    (function () {
      var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      window.blApplyTheme = function (choice) {
        if (choice !== 'light' && choice !== 'dark') {
          try { choice = localStorage.getItem('bgglibrary.theme') || 'system'; } catch (e) { choice = 'system'; }
        }
        var dark = choice === 'dark' || (choice !== 'light' && !!media && media.matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#191817' : '#ffffff');
      };
      window.blApplyTheme();
      // In "system" mode, follow the phone if it switches (e.g. at sunset).
      if (media && media.addEventListener) media.addEventListener('change', function () { window.blApplyTheme(); });
    })();
  </script>
