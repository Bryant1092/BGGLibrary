# Builds the fork (bgg-library-test Firebase) and publishes it to this repo's gh-pages branch,
# i.e. https://bryant1092.github.io/BGGLibrary/. Linux version of the PowerShell steps in README
# "Deploying". Never touches billythekid664/BGGLibrary.
name: Deploy to GitHub Pages

on:
  push:
    branches: [feature/redesign]
    paths-ignore: ['**.md', 'functions/**', 'firestore.rules', 'firestore.indexes.json', '.github/workflows/deploy-firebase.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # Checks before every deploy (added 2026-11-20, "gentle" mode for the con; README → Checks
  # before deploy). A failing step here stops the deploy job below from starting.
  checks:
    if: github.repository == 'Bryant1092/BGGLibrary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Blocks: ESLint errors in TypeScript and templates (incl. accessibility rules). The
      # rules in eslint.config.js's GENTLE list only warn for now.
      - name: Lint
        run: npx ng lint

      # Blocks: a syntax error in the Firebase functions (they deploy separately, by hand).
      - name: Functions syntax
        run: node --check functions/index.js

      # Reports only, for now: known security issues in the libraries the app and the server
      # use. On 2026-11-20: app 25 (2 critical, 9 high; most fixed by a newer Angular),
      # functions 8 moderate. After the con: upgrade, then drop continue-on-error so high and
      # critical issues block (README → After the convention).
      - name: Security audit of dependencies (not blocking yet)
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high
          cd functions && npm audit --omit=dev --audit-level=high

      # Reports only, for now: the old *.spec.ts files are Angular defaults and 6 of 10 fail.
      # After the con: rewrite them and remove continue-on-error.
      - name: Unit tests (not blocking yet)
        continue-on-error: true
        run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    # Only after the checks pass.
    needs: checks
    # Safety: only ever deploy from Bryant's fork.
    if: github.repository == 'Bryant1092/BGGLibrary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 1. Build against the fork's Firebase, stamped with the build time (Account > Version).
      #    Any build error fails the job here, so an empty folder is never published.
      - name: Build (production,fork)
        run: |
          npx ng build --configuration production,fork --base-href=/BGGLibrary/ \
            --define "BUILD_TIME=$(date +%s%3N)" --output-path=dist/out

      # 2. A wrong base href means a blank site.
      - name: Check base href
        run: grep -q '<base href="/BGGLibrary/">' dist/out/browser/index.html

      # 3. Same extras angular-cli-ghpages adds, plus byte-for-byte files for the service worker.
      - name: Pages extras
        run: |
          cd dist/out/browser
          cp index.html 404.html
          touch .nojekyll
          printf '* -text\n' > .gitattributes

      # 4. Publish to this repo's gh-pages branch (replaces its contents).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/out/browser
          commit_message: 'Deploy ${{ github.sha }}'
