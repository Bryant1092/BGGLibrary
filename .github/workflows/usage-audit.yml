# One-off deep check of what Firebase/Google Cloud usage is made of (bgg-library-test), to
# confirm the free-tier math before changing the watcher. Totals and settings only.
name: Usage audit (manual)

on:
  workflow_dispatch:

jobs:
  audit:
    if: github.repository == 'Bryant1092/BGGLibrary'
    runs-on: ubuntu-latest
    steps:
      - name: Service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Function settings
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          for f in checkwatchedgames checkprizedrawings syncwatchindex; do
            echo "== $f"
            gcloud run services describe "$f" --project bgg-library-test --region us-central1 --format=json 2>&1 \
              | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print('  not readable'); sys.exit()
          t=d['spec']['template']; a=t['metadata'].get('annotations',{}); c=t['spec']['containers'][0]
          print('  cpu', c['resources']['limits'].get('cpu'), 'memory', c['resources']['limits'].get('memory'))
          print('  cpu throttling (true = billed only while running):', a.get('run.googleapis.com/cpu-throttling','(default: true)'))
          print('  min instances:', a.get('autoscaling.knative.dev/minScale','0'), ' max instances:', a.get('autoscaling.knative.dev/maxScale'))
          print('  concurrency:', t['spec'].get('containerConcurrency'), ' timeout:', t['spec'].get('timeoutSeconds'))
          "
          done
      - name: Scheduler jobs, image storage
        run: |
          echo "== Scheduler jobs (3 free per billing account)"
          gcloud scheduler jobs list --project bgg-library-test --location us-central1 --format="value(name.basename(),schedule,state)" 2>&1 | tail -5
          echo "== Artifact Registry (0.5 GB free)"
          gcloud artifacts repositories list --project bgg-library-test --format="value(name.basename(),sizeBytes)" 2>&1 | tail -5
      - name: Builds, images, secrets, logs
        run: |
          echo "== Cloud Build this month (free: 2,500 build-minutes/month)"
          gcloud builds list --project bgg-library-test --region us-central1 --limit 200 \
            --filter="createTime>=$(date -u +%Y-%m-01T00:00:00Z)" --format="value(startTime,finishTime)" 2>/dev/null \
            | python3 -c "
          import sys
          from datetime import datetime
          t=[l.split() for l in sys.stdin if len(l.split())==2]
          secs=sum((datetime.fromisoformat(b)-datetime.fromisoformat(a)).total_seconds() for a,b in t)
          print(f'  {len(t)} builds, {secs/60:.1f} build-minutes')"
          echo "== Artifact Registry images (free: 0.5 GB)"
          gcloud artifacts repositories describe gcf-artifacts --project bgg-library-test --location us-central1 --format="value(sizeBytes)" 2>&1 | tail -1 | awk '{printf "  %.1f MB stored\n", $1/1e6}'
          gcloud artifacts docker images list us-central1-docker.pkg.dev/bgg-library-test/gcf-artifacts --include-tags --format="value(package.basename(),createTime.date('%m-%d %H:%M'))" 2>&1 | sort | uniq -c | head -12
          gcloud artifacts repositories describe gcf-artifacts --project bgg-library-test --location us-central1 --format="value(cleanupPolicies)" 2>&1 | cut -c1-200
          echo "== Secret Manager (free: 6 active versions, 10,000 accesses/month)"
          for s in $(gcloud secrets list --project bgg-library-test --format="value(name)" 2>/dev/null); do
            echo "  $s: $(gcloud secrets versions list $s --project bgg-library-test --filter=state=ENABLED --format='value(name)' | wc -l) enabled version(s)"
          done
          echo "== Cloud Storage buckets (free: 5 GB in us-central1)"
          gcloud storage buckets list --project bgg-library-test --format="value(name,location)" 2>&1 | head -10
          for b in $(gcloud storage buckets list --project bgg-library-test --format="value(name)" 2>/dev/null); do
            echo "  $b: $(gcloud storage du -s gs://$b 2>/dev/null | awk '{printf "%.1f MB", $1/1e6}')"
          done
          echo "== Enabled APIs that can bill"
          gcloud services list --enabled --project bgg-library-test --format="value(config.name)" 2>&1 | grep -iE "compute|run|cloudfunctions|scheduler|storage|artifact|secret|build|pubsub|eventarc|identitytoolkit|firestore|logging|bigquery" | sort
      - name: Usage breakdown
        run: |
          export TOKEN=$(gcloud auth print-access-token)
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          P = 'bgg-library-test'
          now = datetime.now(timezone.utc)
          pt = datetime.now(ZoneInfo('America/Los_Angeles'))
          today = pt.replace(hour=0, minute=0, second=0, microsecond=0).astimezone(timezone.utc)
          month = pt.replace(day=1, hour=0, minute=0, second=0, microsecond=0).astimezone(timezone.utc)
          def series(metric, since, until, align, aligner='ALIGN_SUM', group=None, reducer='REDUCE_SUM'):
              q = {'filter': f'metric.type="{metric}"', 'interval.startTime': since.strftime('%Y-%m-%dT%H:%M:%SZ'),
                   'interval.endTime': until.strftime('%Y-%m-%dT%H:%M:%SZ'),
                   'aggregation.alignmentPeriod': f'{align}s', 'aggregation.perSeriesAligner': aligner,
                   'aggregation.crossSeriesReducer': reducer}
              if group: q['aggregation.groupByFields'] = group
              url = f'https://monitoring.googleapis.com/v3/projects/{P}/timeSeries?' + urllib.parse.urlencode(q, doseq=True)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['TOKEN']}))).get('timeSeries', [])
              except urllib.error.HTTPError as e:
                  print('  error', e.code, e.read().decode()[:150]); return []
          val = lambda p: float(p['value'].get('int64Value', p['value'].get('doubleValue', 0)))
          span = lambda a, b: int((b - a).total_seconds()) + 60
          print('== Functions this month, per service')
          for m, label in [('run.googleapis.com/request_count', 'runs'), ('run.googleapis.com/container/billable_instance_time', 'billable s')]:
              for ts in series(m, month, now, span(month, now), group='resource.label.service_name'):
                  name = ts['resource']['labels'].get('service_name', '?')
                  print(f'  {name:22} {label:11} {sum(val(p) for p in ts["points"]):>10,.0f}')
          print('== Functions, last 6 hours (billable seconds per hour, checkwatchedgames)')
          for ts in series('run.googleapis.com/container/billable_instance_time', now - timedelta(hours=6), now, 3600, group='resource.label.service_name'):
              if ts['resource']['labels'].get('service_name') == 'checkwatchedgames':
                  pts = sorted(ts['points'], key=lambda p: p['interval']['endTime'])
                  print('  ' + ', '.join(f"{datetime.fromisoformat(p['interval']['endTime'].replace('Z','+00:00')).astimezone(ZoneInfo('America/Chicago')):%H:%M} {val(p):.0f}s" for p in pts))
          print('== Firestore reads per hour, Friday (Central time)')
          fri0 = today - timedelta(days=1)
          for m in ['firestore.googleapis.com/document/read_ops_count', 'firestore.googleapis.com/document/write_ops_count']:
              for ts in series(m, fri0, today, 3600):
                  pts = sorted(ts['points'], key=lambda p: p['interval']['endTime'])
                  print('  ' + m.split('/')[-1] + ': ' + ', '.join(f"{datetime.fromisoformat(p['interval']['endTime'].replace('Z','+00:00')).astimezone(ZoneInfo('America/Chicago')):%-I%p} {val(p):.0f}" for p in pts))
          print('== Firestore reads by day this month')
          for ts in series('firestore.googleapis.com/document/read_ops_count', month, today, 86400):
              print('  ' + ', '.join(f"{datetime.fromisoformat(p['interval']['startTime'].replace('Z','+00:00')).astimezone(ZoneInfo('America/Los_Angeles')):%b %d} {val(p):.0f}" for p in sorted(ts['points'], key=lambda p: p['interval']['endTime'])))
          print('== Network sent this month, by function and destination (free: 1 GiB/month to the internet, North America)')
          for ts in series('run.googleapis.com/container/network/sent_bytes_count', month, now, span(month, now), group=['resource.label.service_name', 'metric.label.kind']):
              print(f"  {ts['resource']['labels'].get('service_name'):22} {ts['metric']['labels'].get('kind','?'):10} {sum(val(p) for p in ts['points'])/1e6:,.1f} MB")
          print('== Network received this month (incoming is free)')
          for ts in series('run.googleapis.com/container/network/received_bytes_count', month, now, span(month, now), group=['resource.label.service_name']):
              print(f"  {ts['resource']['labels'].get('service_name'):22} {sum(val(p) for p in ts['points'])/1e6:,.1f} MB")
          print('== Sent per hour, last 6 h (checkwatchedgames + checkprizedrawings)')
          for ts in series('run.googleapis.com/container/network/sent_bytes_count', now - timedelta(hours=6), now, 3600, group=['resource.label.service_name']):
              pts = sorted(ts['points'], key=lambda p: p['interval']['endTime'])
              print(f"  {ts['resource']['labels'].get('service_name'):22} " + ', '.join(f'{val(p)/1e6:.2f}' for p in pts) + ' MB/h')
          print('== Logs ingested this month (free: 50 GiB)')
          for ts in series('logging.googleapis.com/billing/bytes_ingested', month, now, span(month, now)):
              print(f"  {sum(val(p) for p in ts['points'])/1e6:,.1f} MB")
          EOF
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
