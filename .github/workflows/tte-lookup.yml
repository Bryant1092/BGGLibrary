# Looks up library copies in Tabletop.Events (public data) and prints each copy's status,
# shelf and barcode. For checking the app against what's on the shelves, from a phone.
name: Library lookup (manual)

on:
  workflow_dispatch:
    inputs:
      query:
        description: Game name to search
        required: true

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Look up
        env:
          Q: ${{ inputs.query }}
        run: |
          url="https://tabletop.events/api/library/0AEB11DA-2B7D-11EC-B400-855F800FD618/librarygames"
          # Health check first: status, time and the start of the body, so an outage is visible.
          for u in "$url?_items_per_page=1" "https://tabletop.events/api/convention/CC4FC78E-17EC-11F1-9082-3FD444321FD1"; do
            curl -s -m 45 -o /tmp/body -w "HEALTH %{http_code} %{time_total}s  $u\n" "$u" || echo "HEALTH failed $u"
            echo "BODY $(head -c 200 /tmp/body | tr '\n' ' ')"
          done
          curl -sS -G "$url" --data-urlencode "query=$Q" --data-urlencode "_items_per_page=50" \
            | jq -r '.result.items[] | [ .name, (.catalog_number // "-"), (if .is_checked_out == 1 then "OUT" else "in" end),
                  ("out " + (.last_checkout_date // "-")), ("in " + (.last_checkin_date // "-")),
                  ("shelf " + ((.custom_fields.Location // "-")|tostring)), ("circ " + ((.is_in_circulation // "-")|tostring)) ] | @tsv'
