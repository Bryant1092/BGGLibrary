# Prints today's Firebase usage (bgg-library-test) next to the free limits, so usage can be
# checked from a phone. Totals only. Firestore's free quota resets at midnight Pacific; this
# counts from then. Needs the deploy service account to have the Monitoring Viewer role.
name: Usage today (manual)

on:
  workflow_dispatch:

jobs:
  usage:
    if: github.repository == 'Bryant1092/BGGLibrary'
    runs-on: ubuntu-latest
    steps:
      - name: Service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Usage
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          export TOKEN=$(gcloud auth print-access-token)
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          P = 'bgg-library-test'
          now = datetime.now(timezone.utc)
          pt = datetime.now(ZoneInfo('America/Los_Angeles'))
          start = pt.replace(hour=0, minute=0, second=0, microsecond=0).astimezone(timezone.utc)
          month = pt.replace(day=1, hour=0, minute=0, second=0, microsecond=0).astimezone(timezone.utc)
          def total(metric, since, extra='', until=None):
              q = {
                'filter': f'metric.type="{metric}"{extra}',
                'interval.startTime': since.strftime('%Y-%m-%dT%H:%M:%SZ'),
                'interval.endTime': (until or now).strftime('%Y-%m-%dT%H:%M:%SZ'),
                'aggregation.alignmentPeriod': f'{int(((until or now) - since).total_seconds()) + 60}s',
                'aggregation.perSeriesAligner': 'ALIGN_SUM',
                'aggregation.crossSeriesReducer': 'REDUCE_SUM',
              }
              url = f'https://monitoring.googleapis.com/v3/projects/{P}/timeSeries?' + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['TOKEN']})
              try:
                  data = json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as e:
                  return f'error {e.code}: {e.read().decode()[:160]}'
              s = 0
              for ts in data.get('timeSeries', []):
                  for p in ts.get('points', []):
                      v = p['value']
                      s += float(v.get('int64Value', v.get('doubleValue', 0)))
              return s
          def show(label, value, limit):
              if isinstance(value, str):
                  print(f'{label:34} {value}'); return
              pct = f'{100 * value / limit:5.1f}% of {limit:,}' if limit else ''
              print(f'{label:34} {value:>12,.0f}   {pct}')
          def firestore(title, since, until=None):
              print(title)
              show('  Firestore reads', total('firestore.googleapis.com/document/read_ops_count', since, until=until), 50000)
              show('  Firestore writes', total('firestore.googleapis.com/document/write_ops_count', since, until=until), 20000)
              show('  Firestore deletes', total('firestore.googleapis.com/document/delete_ops_count', since, until=until), 20000)
          firestore(f'Yesterday, full free-quota day ({start - timedelta(days=1):%a %b %d}, midnight-midnight Pacific):', start - timedelta(days=1), start)
          firestore('Last 24 hours:', now - timedelta(hours=24))
          hours = (now - start).total_seconds() / 3600
          print(f'Since midnight Pacific ({hours:.1f} h ago):')
          show('Firestore reads', total('firestore.googleapis.com/document/read_ops_count', start), 50000)
          show('Firestore writes', total('firestore.googleapis.com/document/write_ops_count', start), 20000)
          show('Firestore deletes', total('firestore.googleapis.com/document/delete_ops_count', start), 20000)
          # Bells right now, from the one summary document (1 read). Counts only, no ids printed.
          url = f'https://firestore.googleapis.com/v1/projects/{P}/databases/(default)/documents/meta/watchIndex'
          try:
              doc = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['TOKEN']})))
              keys = list(doc.get('fields', {}).get('bells', {}).get('mapValue', {}).get('fields', {}).keys())
              per = {}
              for k in keys:
                  uid, _, game = k.partition('__')
                  per.setdefault(uid, set()).add(game)
              games = {k.partition('__')[2] for k in keys}
              sizes = sorted((len(v) for v in per.values()), reverse=True)
              print(f'\nBells now: {len(keys)} bells, {len(per)} people, {len(games)} different games; per person: {sizes}')
          except Exception as e:
              print('\nBells now: could not read', e)
          print(f'\nThis month (since {month:%b} 1):')
          show('Function requests', total('run.googleapis.com/request_count', month), 2000000)
          show('Function billable time (seconds)', total('run.googleapis.com/container/billable_instance_time', month), 0)
          EOF
      - name: Function sizes (CPU and memory)
        run: |
          for f in checkwatchedgames checkprizedrawings; do
            gcloud run services describe "$f" --project bgg-library-test --region us-central1 \
              --format="value(metadata.name,spec.template.spec.containers[0].resources.limits.cpu,spec.template.spec.containers[0].resources.limits.memory)" 2>&1 | tail -1
          done
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
